plugins {
  id 'java-library'
  id 'maven-publish'
  id 'signing'
}

group = 'games.pixscape'
version = appVersion

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaVersion as int)
  }
  withSourcesJar()
  withJavadocJar()
}

def vendoredJunit = file('lib/junit-4.13.2.jar')
def vendoredHamcrest = file('lib/hamcrest-core-1.3.jar')
def useVendoredTestLibs = vendoredJunit.exists() && vendoredHamcrest.exists()

dependencies {
  api "com.badlogicgames.gdx:gdx:${gdxVersion}"
  api "com.badlogicgames.gdx:gdx-ai:${aiVersion}"
  api "net.onedaybeard.artemis:artemis-odb:${artemisOdbVersion}"
  api "net.onedaybeard.artemis:artemis-odb-serializer-json-libgdx:${artemisOdbVersion}"
  api "com.badlogicgames.gdx:gdx-box2d:${gdxVersion}"
  api "it.unimi.dsi:fastutil:${fastutilVersion}"

  if (useVendoredTestLibs) {
    testImplementation files(vendoredJunit, vendoredHamcrest)
  } else {
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.hamcrest:hamcrest-core:${hamcrestVersion}"
  }

  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:${gdxVersion}:natives-desktop"
}

tasks.named('test', Test).configure {
  useJUnit()
}

tasks.named('javadoc', Javadoc).configure {
  failOnError = false
  options.addStringOption('Xdoclint:none', '-quiet')
  options.encoding = 'UTF-8'
  options.charSet = 'UTF-8'
}

publishing {
  publications {
    create("mavenJava", MavenPublication) {
      artifactId = "pixscape-runtime"
      from components.java

      pom {
        name = "pixscape-runtime"
        description = "Pixscape runtime library"
        url = "https://github.com/pixscapegames/pixscape-runtime"

        licenses {
          license {
            name = "Apache License, Version 2.0"
            url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
          }
        }

        developers {
          developer {
            id = "laurent"
            name = "Laurent"
          }
        }

        scm {
          url = "https://github.com/pixscapegames/pixscape-runtime"
          connection = "scm:git:https://github.com/pixscapegames/pixscape-runtime.git"
          developerConnection = "scm:git:ssh://git@github.com/pixscapegames/pixscape-runtime.git"
        }
      }
    }
  }
}

signing {
  useGpgCmd()
  sign publishing.publications.mavenJava
}