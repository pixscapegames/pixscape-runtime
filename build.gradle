plugins {
  id 'java-library'
  id 'maven-publish'
  id 'signing'
}

group = 'games.pixscape'
version = appVersion

def runtimeJavaRelease = 8

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaVersion as int)
  }
  sourceCompatibility = JavaVersion.toVersion(runtimeJavaRelease)
  targetCompatibility = JavaVersion.toVersion(runtimeJavaRelease)
  withSourcesJar()
  withJavadocJar()
}

dependencies {
  api "com.badlogicgames.gdx:gdx:${gdxVersion}"
  api "com.badlogicgames.gdx:gdx-ai:${aiVersion}"
  api "net.onedaybeard.artemis:artemis-odb:${artemisOdbVersion}"
  api "net.onedaybeard.artemis:artemis-odb-serializer-json-libgdx:${artemisOdbVersion}"
  api "com.badlogicgames.gdx:gdx-box2d:${gdxVersion}"
  api "com.github.tommyettinger:textratypist:2.5.0"

  testImplementation "junit:junit:${junitVersion}"
  testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"

  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:${gdxVersion}:natives-desktop"
}

tasks.named('test', Test).configure {
  useJUnit()
  exclude '**/HudMaterializerGlSmokeTest.class'
  exclude '**/TextraHudBatchGlPrototypeTest.class'
}

tasks.register('hudGlSmoke', Test) {
  description = 'Runs the real desktop GL30 HUD integration smoke.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnit()
  include '**/HudMaterializerGlSmokeTest.class'
  shouldRunAfter tasks.named('test')
}

tasks.register('textraHudGlPrototype', Test) {
  description = 'Runs the TextraTypist 2.5.0 prototype through the real desktop HudBatch.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnit()
  include '**/TextraHudBatchGlPrototypeTest.class'
  shouldRunAfter tasks.named('test')
}

tasks.named('compileJava', JavaCompile).configure {
  options.release = runtimeJavaRelease
}

tasks.named('compileTestJava', JavaCompile).configure {
  options.release = project.property('javaVersion') as int
}

tasks.named('javadoc', Javadoc).configure {
  failOnError = false
  options.addStringOption('Xdoclint:none', '-quiet')
  options.encoding = 'UTF-8'
  options.charSet = 'UTF-8'
}

publishing {
  publications {
    create("mavenJava", MavenPublication) {
      artifactId = "pixscape-runtime"
      from components.java

      pom {
        name = "pixscape-runtime"
        description = "Pixscape runtime library"
        url = "https://github.com/pixscapegames/pixscape-runtime"
        properties = [
                'maven.compiler.release': runtimeJavaRelease.toString()
        ]

        licenses {
          license {
            name = "Apache License, Version 2.0"
            url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
          }
        }

        developers {
          developer {
            id = "laurent"
            name = "Laurent"
          }
        }

        scm {
          url = "https://github.com/pixscapegames/pixscape-runtime"
          connection = "scm:git:https://github.com/pixscapegames/pixscape-runtime.git"
          developerConnection = "scm:git:ssh://git@github.com/pixscapegames/pixscape-runtime.git"
        }
      }
    }
  }

  repositories {
    maven {
      name = "centralBundle"
      url = uri(layout.buildDirectory.dir("central-bundle").get().asFile)
    }
  }
}

def isMavenLocalPublish = gradle.startParameter.taskNames.any {
  it.toLowerCase().contains('mavenlocal')
}

if (!isMavenLocalPublish) {
  signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
  }
}
